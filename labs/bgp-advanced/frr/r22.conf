interface eth-r3
  ip address 10.0.2.2/24

interface eth-r21
  ip address 192.168.2.2/24


ip prefix-list PL-BGP-IN seq 10 permit 192.168.3.0/24

ip prefix-list PL-BGP-OUT seq 10 permit 192.168.2.0/24
ip prefix-list PL-BGP-OUT seq 15 permit 192.168.1.0/24

route-map RM-BGP-IN permit 10
  match ip address prefix-list PL-BGP-IN

route-map RM-BGP-OUT permit 10
  match ip address prefix-list PL-BGP-OUT


router bgp 65002
  bgp router-id 10.0.2.2
  neighbor 10.0.2.3 remote-as 65003

  neighbor 192.168.2.1 remote-as 65002
  neighbor 192.168.2.1 next-hop-self

  address-family ipv4 unicast
    network 192.168.2.0/24

    neighbor 10.0.2.3 route-map RM-BGP-IN in
    neighbor 10.0.2.3 route-map RM-BGP-OUT out
  exit-address-family


debug bgp updates detail

