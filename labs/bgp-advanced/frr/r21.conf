interface eth-r1
  ip address 10.0.1.2/24

interface eth-r22
  ip address 192.168.2.1/24


ip prefix-list PL-BGP-IN seq 5 permit 192.168.1.0/24

ip prefix-list PL-BGP-OUT seq 5 permit 192.168.2.0/24
ip prefix-list PL-BGP-OUT seq 10 permit 192.168.3.0/24

route-map RM-BGP-IN permit 10
  match ip address prefix-list PL-BGP-IN

route-map RM-BGP-OUT permit 10
  match ip address prefix-list PL-BGP-OUT


router bgp 65002
  bgp router-id 10.0.1.2
  neighbor 10.0.1.1 remote-as 65001

  neighbor 192.168.2.2 remote-as 65002
  neighbor 192.168.2.2 next-hop-self

  address-family ipv4 unicast
    network 192.168.2.0/24

    neighbor 10.0.1.1 route-map RM-BGP-IN in
    neighbor 10.0.1.1 route-map RM-BGP-OUT out
  exit-address-family


debug bgp updates detail

