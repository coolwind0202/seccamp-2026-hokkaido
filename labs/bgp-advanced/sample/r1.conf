interface eth-r21
  ip address 10.0.1.1/24

interface eth-h1
  ip address 192.168.1.1/24


# 経路フィルタ用の prefix-list
ip prefix-list PL-BGP-IN seq 5 permit 192.168.2.0/24
ip prefix-list PL-BGP-IN seq 10 permit 192.168.3.0/24

ip prefix-list PL-BGP-OUT seq 5 permit 192.168.1.0/24


# 経路フィルタ用の route-map
route-map RM-BGP-IN permit 10
  match ip address prefix-list PL-BGP-IN

route-map RM-BGP-OUT permit 10
  match ip address prefix-list PL-BGP-OUT


router bgp 65001
  bgp router-id 10.0.1.1
  neighbor 10.0.1.2 remote-as 65002

  address-family ipv4 unicast
    network 192.168.1.0/24

    # 経路フィルタの適用
    neighbor 10.0.1.2 route-map RM-BGP-IN in
    neighbor 10.0.1.2 route-map RM-BGP-OUT out
  exit-address-family


debug bgp updates detail

