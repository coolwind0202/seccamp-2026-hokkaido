name: static-routing

topology:
  groups:
    routers:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1

    hosts:
      kind: linux
      image: ghcr.io/nicolaka/netshoot:v0.16

  nodes:
    r1:
      group: routers
      binds:
        - r1.conf:/etc/frr/frr.conf
    r2:
      group: routers
      binds:
        - r2.conf:/etc/frr/frr.conf

    h1:
      group: hosts
      exec:
        - ip link set eth1 up
        - ip address add 192.168.1.1/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.1.0
      kind: linux
      image: ghcr.io/nicolaka/netshoot:v0.16
    h2:
      group: hosts
      exec:
        - ip link set eth1 up
        - ip address add 192.168.2.1/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.2.0
      kind: linux
      image: ghcr.io/nicolaka/netshoot:v0.16

  links:
    - endpoints: [ "r1:eth1", "h1:eth1" ]
    - endpoints: [ "r2:eth1", "h2:eth1" ]

    - endpoints: [ "r1:eth2", "r2:eth2" ]
